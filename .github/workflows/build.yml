name: Build and Test Docker Container

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test Docker Container
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: docker build -t isaac-magic-app .

    - name: Run Docker container
      run: |
        docker run --env-file .env -d -p 8000:8000 --name isaac-magic-app isaac-magic-app
        sleep 10 # Wait for the container to initialize

    - name: Test Docker container
      run: |
        docker ps | grep isaac-magic-app || exit 1
        curl -f http://localhost:8000 || exit 1

    - name: Stop and remove container
      if: always()
      run: |
        docker stop isaac-magic-app
        docker rm isaac-magic-app
