<div id="draft-lobby-section" class="mt-5">
    <h3>Create a Draft Lobby</h3>
    <form id="draft-lobby-form">
        {% csrf_token %}
        <div class="mb-3">
            <label for="cube_id" class="form-label">Cube ID</label>
            <input type="number" name="cube_id" id="cube_id" class="form-control" placeholder="Enter Cube ID" required>
        </div>
        <div class="mb-3">
            <label for="pack_count" class="form-label">Number of Packs</label>
            <input type="number" name="pack_count" id="pack_count" class="form-control" value="3" min="1" required>
        </div>
        <div class="mb-3">
            <label for="cards_per_pack" class="form-label">Cards Per Pack</label>
            <input type="number" name="cards_per_pack" id="cards_per_pack" class="form-control" value="5" min="1" required>
        </div>
        <div class="mb-3">
            <label for="max_players" class="form-label">Max Players</label>
            <input type="number" name="max_players" id="max_players" class="form-control" value="8" min="2" required>
        </div>
        <button type="submit" class="btn btn-primary">Create Lobby</button>
    </form>
    <div id="draft-lobby-feedback" class="mt-3"></div>
</div>

<script>
document.getElementById("draft-lobby-form").addEventListener("submit", async function (e) {
    e.preventDefault();

    const form = e.target;
    const formData = new FormData(form);
    const feedback = document.getElementById("draft-lobby-feedback");

    feedback.innerText = "Creating lobby...";

    try {
        const response = await fetch("{% url 'drafts-create-lobby' %}", {
            method: "POST",
            headers: {
                "X-CSRFToken": "{{ csrf_token }}",
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                cube_id: formData.get("cube_id"),
                pack_count: formData.get("pack_count"),
                cards_per_pack: formData.get("cards_per_pack"),
                max_players: formData.get("max_players"),
            }),
        });

        if (response.ok) {
            const data = await response.json();
            window.location.href = data.redirect_url; // Redirect to the new draft lobby
        } else {
            const errorData = await response.json();
            feedback.innerHTML = `<div class="alert alert-danger">${errorData.error || "Failed to create lobby!"}</div>`;
        }
    } catch (error) {
        console.error("Error:", error);
        feedback.innerHTML = `<div class="alert alert-danger">Network error while creating the lobby.</div>`;
    }
});
</script>
